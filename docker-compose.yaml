version: "3.9"
services:
  pipeline:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: tides_pipeline
    environment:
      TIDES_CONFIG: '/app/tides_pipe/config/config.yml'
      LOG_DIR: '/data/logs'
      DELIVERIES_DIR: '/data/deliveries'
      SPECTRA_DIR: '/data/spectra'
      STATIC_PLOTS_DIR: '/data/static/plots'
      # Remote Postgres (set these via .env or CI secrets)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}   # optional: require/verify-full if needed
      # Classifier endpoints (adjust to your deployment)
      SNID_API_URL: ${CLASSIFIER_SNID_URL:-http://snid_api:8000}
      NGSF_API_URL: ${CLASSIFIER_NGSF_URL:-http://ngsf_api:8000}
    volumes:
      - ./deliveries:/data/deliveries
      - ./spectra:/data/spectra
      - ./static/plots:/data/static/plots
      - ./config/config.yml:/app/tides_pipe/config/config.yml:ro
      - snid_api_runs:/snid_api_runs
      - ngsf_api_runs:/ngsf_api_runs
    ports:
      - "8000:8000"
    depends_on:
      - snid_api
      - ngsf_api

  watcher:
    build:
      context: .
      dockerfile: ./Dockerfile.watcher
    container_name: tides_watcher
    environment:
      - DELIVERIES_DIR=/data/deliveries
      - PIPELINE_API=http://pipeline:8000
    volumes:
      - ./deliveries:/data/deliveries
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - pipeline

  snid_api:
    build: ./modules/classifiers/snid_docker/
    expose:
      - "8000"
    volumes:
      - ./spectra:/data/spectra:ro
      - snid_api_runs:/snid_api_runs

  ngsf_api:
    build: ./modules/classifiers/ngsf_docker/
    expose:
      - "8000"
    working_dir: /data/spectra
    volumes:
      - ./spectra:/data/spectra:ro
      - ngsf_api_runs:/ngsf_api_runs

volumes:
  snid_api_runs:
  ngsf_api_runs: