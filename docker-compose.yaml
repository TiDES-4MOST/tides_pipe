services:
  pipeline:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: tides_pipeline
    environment:
      TIDES_CONFIG: ${CONFIG_PATH}/config.yml
      DELIVERIES_DIR: ${DELIVERIES_DIR}
      SPECTRA_DIR: ${SPECTRA_DIR}
      STATIC_PLOTS_DIR: ${STATIC_PLOTS_DIR}
      # remote DB creds provided at runtime (compose .env or CI secrets)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      CLASSIFIER_SNID_URL: ${CLASSIFIER_SNID_URL:-http://snid_api:8000}
      CLASSIFIER_NGSF_URL: ${CLASSIFIER_NGSF_URL:-http://ngsf_api:8000}
    volumes:
      - ${DATA_DELIVERIES_PATH:-./deliveries}:${DELIVERIES_DIR}
      - ${DATA_SPECTRA_PATH:-./spectra}:${SPECTRA_DIR}
      - ${DATA_STATIC_PATH:-./static/plots}:${STATIC_PLOTS_DIR}
      - ./config/config.yml:${CONFIG_PATH}/config.yml:ro
    ports:
      - "8001:8001"  # uvicorn port for ingest_api
    command: >
      uvicorn tides_pipe.ingest_api:app
      --host 0.0.0.0 --port 8001
    depends_on:
      - snid_api
      - ngsf_api
      - qxp_api

  watcher:
    build:
      context: .
      dockerfile: ./Dockerfile.watcher
    container_name: tides_watcher
    environment:
      DELIVERIES_DIR: ${DELIVERIES_DIR}
      PIPELINE_API: http://pipeline:8001
    volumes:
      - ${DATA_DELIVERIES_PATH:-./deliveries}:${DELIVERIES_DIR}
    depends_on:
      - pipeline

  snid_api:
    build: ./modules/classifiers/snid_docker/
    expose: ["8000"]
    volumes:
      - ${DATA_SPECTRA_PATH:-./spectra}:${SPECTRA_DIR}:ro

  ngsf_api:
    build: ./modules/classifiers/ngsf_docker/
    expose: ["8000"]
    working_dir: ${SPECTRA_DIR}
    volumes:
      - ${DATA_SPECTRA_PATH:-./spectra}:${SPECTRA_DIR}:ro

  qxp_api:
    build: ./modules/classifiers/qxp/
    expose: ["8000"]
    working_dir: ${SPECTRA_DIR}
    volumes:
      - ${DATA_SPECTRA_PATH:-./spectra}:${SPECTRA_DIR}:ro

volumes: {}
