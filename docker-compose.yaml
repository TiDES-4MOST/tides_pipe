services:
  pipeline:
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      TIDES_CONFIG: /app/tides_pipe/config/config.yml
      DELIVERIES_DIR: /data/deliveries
      SPECTRA_DIR: /data/spectra
      # remote DB creds provided at runtime (compose .env or CI secrets)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_ENABLED: ${SLACK_ENABLED:-true}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      SNID_API_URL: http://192.168.10.117:8000
      NGSF_API_URL: http://192.168.10.117:8001
      TRANSIENT_API_TOKEN: ${TRANSIENT_API_TOKEN}
      INGEST_ALLOW_TEMP: ${INGEST_ALLOW_TEMP:-"false"}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TEST: ${TEST:-"false"}
    volumes:
      - /mnt/data/deliveries:/data/deliveries:rw
      - /mnt/data/spectra:/data/spectra:rw
      - /mnt/api_results/snid_api_runs:/snid_api_runs:rw
      - /mnt/api_results/ngsf_api_runs:/ngsf_api_runs:rw
      - ./config/config.yml:/app/tides_pipe/config/config.yml:ro
    ports:
      - "8001:8001"  # uvicorn port for ingest_api
    command: >
      uvicorn tides_pipe.ingest_api:app
      --host 0.0.0.0 --port 8001
    depends_on:
      #- snid_api
      #- ngsf_api
      - qxp_api
    #networks:
    #  - backend
    # user: "1000:1000"

  watcher:
    build:
      context: .
      dockerfile: ./Dockerfile
    command: ["python", "-u", "-m", "tides_pipe.watcher"]
    environment:
      DELIVERIES_DIR: /data/deliveries
      PIPELINE_API: http://pipeline:8001
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
      WATCHER_POLLING: "1"   # enable if /mnt/data is NFS/CIFS/remote
      NIGHT_CUTOFF_DATE: ${NIGHT_CUTOFF_DATE:-20260120}  # Ignore nights before this date (format: YYYYMMDD)
    volumes:
      - /mnt/data/deliveries:/data/deliveries:rw
    depends_on:
      - pipeline

  qxp_api:
    build: ./modules/classifiers/qxp/
    expose: ["8000"]
    #working_dir: /data/spectra
    volumes:
      - /mnt/data/spectra:/data/spectra:ro

volumes: {}

