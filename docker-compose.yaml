services:
  pipeline:
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      TIDES_CONFIG: /app/tides_pipe/config/config.yml
      DELIVERIES_DIR: /data/deliveries
      SPECTRA_DIR: /data/spectra
      # remote DB creds provided at runtime (compose .env or CI secrets)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      CLASSIFIER_SNID_URL: ${CLASSIFIER_SNID_URL:-http://snid_api:8000}
      CLASSIFIER_NGSF_URL: ${CLASSIFIER_NGSF_URL:-http://ngsf_api:8000}
    volumes:
      - /mnt/data/deliveries:/data/deliveries
      - /mnt/data/spectra:/data/spectra
      #- static_volume_1:/data/static
      - ./config/config.yml:/app/tides_pipe/config/config.yml:ro
    ports:
      - "8001:8001"  # uvicorn port for ingest_api
    command: >
      uvicorn tides_pipe.ingest_api:app
      --host 0.0.0.0 --port 8001
    depends_on:
      #- snid_api
      #- ngsf_api
      - qxp_api
    #networks:
    #  - backend

  watcher:
    build:
      context: .
      dockerfile: ./Dockerfile.watcher
    command: ["python", "-u", "/app/watcher.py"]
    environment:
      DELIVERIES_DIR: /data/deliveries
      PIPELINE_API: http://pipeline:8001
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
      WATCHER_POLLING: "1"   # enable if /mnt/data is NFS/CIFS/remote
    volumes:
      - /mnt/data/deliveries:/data/deliveries:rw
    depends_on:
      - pipeline

  qxp_api:
    build: ./modules/classifiers/qxp/
    expose: ["8000"]
    #working_dir: /data/spectra
    volumes:
      - /mnt/data/spectra:/data/spectra:ro

volumes: {}

