modules:
  - data_ingestion
  - classification_api


data_ingestion:
  test: true  # Enable test mode for data ingestion
  max: 5
classification:
  test: true
  max: 5
  enabled_classifiers:  # Which classifiers to run
    - snid
    - ngsf
  combiner: tom  # 'tom' (fine-grained TidesClass FKs) or 'm25' (coarse, default)

tom_combiner:
  # Path to the classification mapping tables.
  # On prod/test VMs, mount an override via Docker volume if needed.
  # Defaults to config/tom_combiner_config.yml relative to this file.
  config_file: /app/config/tom_combiner_config.yml
db_creds:
  host: "localhost"
  port: 5432
  user: "pwise"
  password: ""
data_paths:
  deliveries_dir: "/data/deliveries"  # Container path for deliveries
  archive_dir: "/data/archive"
  spectra_dir: "/data/spectra"  # Container path for spectra
  #static_plots_dir: "/data/static/plots"
snid:
  defaults:
    wmin: 4000
    wmax: 9000
    zmin: 0.
    zmax: 1.2
    emclip:
    emwid: 40
    agemin: -90
    agemax: 1000
    aband: false
    use:
      - Ia
      - Ib
      - Ic
      - II
      - NotSN
    avoid: []
    avoidsub: []
    usesub:
      - "Ia-norm"
      - "Ic-norm"
      - "Ib-norm"
      - "Ia-91T"
      - "Ia-91bg"
      - "Gal"
      - "IIn"
      - "Ia-pec"
      - "Ia-csm"
      - "IIP"
      - "LBV"
      - "Ib-pec"
      - "Ic-broad"
      - "II-pec"
      - "IIb"
      - "IIL"
      - "M-star"
      - "AGN"

ngsf:
  defaults:
    z: 0.0
    z_min: 0.0
    z_max: 0.1
    z_int: 0.01
    lower_lam: 0.0
    upper_lam: 0.0
    epoch_low: 0
    epoch_high: 0
    alam_low: -2.0
    alam_high: 2.0
    alam_interval: 0.2
    resolution: 20
    mask_telluric: true
    mask_galaxy: true
