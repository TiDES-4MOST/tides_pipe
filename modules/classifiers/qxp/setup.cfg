[metadata]
name = qmostxp
author = Luke Davis, Ole Streicher
url = https://escience.aip.de/readthedocs/iwg8/qxp
description = 4FS extragalactic pipeline
keywords = 4MOST, IWG8, Pipeline, L2
platform = any
license = BSD 3-Clause
license_file = LICENSE.txt

[options]
setup_requires = setuptools_scm
install_requires =
    numpy >= 1.17
    astropy >= 4.0
    scipy
packages =
  qmostxp
  qmostxp/tests
python_requires = >=3.6

[options.extras_require]
test = pytest

[options.package_data]
qmostxp =
  data/*.fits
qmostxp/tests =
  *.fits

[flake8]
exclude = qmostxp/data

[coverage:run]
source = qmostxp
